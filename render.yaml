services:
  - type: web
    name: saas-orders-backend
    env: node
    plan: starter
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: saas-postgres-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: KAFKA_BROKERS
        sync: false
      - key: KAFKA_CLIENT_ID
        value: saas-orders-render
      - key: KAFKA_GROUP_ID
        value: saas-order-consumer-group
      - key: KAFKA_TOPIC_ORDERS
        value: tenant.orders
      - key: KAFKA_SSL
        value: "true"
      - key: KAFKA_USERNAME
        sync: false
      - key: KAFKA_PASSWORD
        sync: false
      - key: SERVERLESS_INVOICE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: saas-postgres-db
    plan: starter
    databaseName: saas_orders
    user: postgres
