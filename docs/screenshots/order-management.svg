<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <rect width="1200" height="680" fill="#f8fafc"/>

  <!-- Top Navigation Header -->
  <rect x="0" y="0" width="1200" height="60" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="30" y="15" width="30" height="30" rx="6" fill="#0284c7"/>
  <text x="39" y="36" font-family="system-ui" font-weight="bold" font-size="16" fill="#ffffff">O</text>
  <text x="70" y="35" font-family="system-ui" font-weight="bold" font-size="16" fill="#0f172a">OmniOrder</text>
  <text x="160" y="35" font-family="system-ui" font-size="12" fill="#64748b">/ Orders / Create Order</text>

  <!-- Tenant Indicator -->
  <rect x="960" y="14" width="200" height="32" rx="6" fill="#f1f5f9"/>
  <text x="975" y="34" font-family="system-ui" font-size="11" font-weight="600" fill="#0369a1">ABC Electronics (Admin)</text>

  <!-- Success Confirmation Banner (HTTP 202 Accepted) -->
  <rect x="80" y="90" width="1040" height="90" rx="12" fill="#ecfdf5" stroke="#10b981"/>
  <circle cx="125" cy="135" r="22" fill="#10b981"/>
  <text x="116" y="142" font-family="system-ui" font-weight="bold" font-size="20" fill="#ffffff">✓</text>
  <text x="165" y="125" font-family="system-ui" font-weight="bold" font-size="16" fill="#065f46">ORDER DURABLY ACCEPTED (HTTP 202 ACCEPTED)</text>
  <text x="165" y="146" font-family="system-ui" font-size="12" fill="#047857">Order ORD-ABC-1004 has been committed to PostgreSQL with atomic inventory reservation and published to Kafka topic tenant.orders.</text>
  <text x="165" y="164" font-family="monospace" font-size="11" font-weight="bold" fill="#0f766e">Kafka Event ID: evt-8c29b-44a1 | Partition Key: tenant_abc | Status: PENDING (Queued)</text>

  <!-- Left Column: Order Form Preview -->
  <rect x="80" y="200" width="640" height="440" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="110" y="235" font-family="system-ui" font-weight="bold" font-size="14" fill="#0f172a">1. Customer &amp; Shipping Account</text>
  <rect x="110" y="250" width="580" height="36" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="125" y="273" font-family="system-ui" font-size="12" fill="#0f172a">Acme Technologies Inc (procurement@acmetech.io)</text>

  <text x="110" y="315" font-family="system-ui" font-weight="bold" font-size="14" fill="#0f172a">2. Order Items &amp; Stock Availability</text>

  <!-- Item Row 1 -->
  <rect x="110" y="330" width="580" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="125" y="355" font-family="monospace" font-size="11" font-weight="bold" fill="#0284c7">ELEC-LT-01</text>
  <text x="230" y="355" font-family="system-ui" font-size="12" font-weight="600" fill="#0f172a">Pro Gaming Laptop 16"</text>
  <text x="230" y="375" font-family="system-ui" font-size="10" fill="#10b981">✓ Available in stock: 45 units</text>
  <text x="490" y="365" font-family="system-ui" font-size="12" fill="#64748b">Qty: 2</text>
  <text x="590" y="365" font-family="system-ui" font-size="13" font-weight="bold" fill="#0f172a">$2,999.98</text>

  <!-- Item Row 2 -->
  <rect x="110" y="400" width="580" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="125" y="425" font-family="monospace" font-size="11" font-weight="bold" fill="#0284c7">ELEC-HD-03</text>
  <text x="230" y="425" font-family="system-ui" font-size="12" font-weight="600" fill="#0f172a">Noise-Cancelling ANC Headphones</text>
  <text x="230" y="445" font-family="system-ui" font-size="10" fill="#10b981">✓ Available in stock: 80 units</text>
  <text x="490" y="435" font-family="system-ui" font-size="12" fill="#64748b">Qty: 1</text>
  <text x="605" y="435" font-family="system-ui" font-size="13" font-weight="bold" fill="#0f172a">$249.99</text>

  <!-- Order Total -->
  <line x1="110" y1="480" x2="690" y2="480" stroke="#e2e8f0"/>
  <text x="110" y="515" font-family="system-ui" font-size="14" font-weight="600" fill="#64748b">Total Order Value:</text>
  <text x="560" y="515" font-family="system-ui" font-size="22" font-weight="bold" fill="#0f172a">$3,249.97</text>

  <!-- Submit Button -->
  <rect x="110" y="550" width="580" height="44" rx="8" fill="#0284c7"/>
  <text x="310" y="577" font-family="system-ui" font-weight="bold" font-size="13" fill="#ffffff">Submit Sales Order (HTTP 202)</text>

  <!-- Right Column: Architecture Guard Callout -->
  <rect x="750" y="200" width="370" height="440" rx="12" fill="#0f172a" stroke="#1e293b"/>
  <text x="775" y="235" font-family="system-ui" font-weight="bold" font-size="14" fill="#ffffff">Transactional Outbox Architecture</text>
  <text x="775" y="255" font-family="system-ui" font-size="11" fill="#38bdf8">Atomic ACID safety with zero message loss</text>

  <g font-family="system-ui" font-size="11" fill="#cbd5e1">
    <text x="775" y="295" font-weight="bold" fill="#34d399">Step 1: ACID Database Transaction</text>
    <text x="790" y="315">• Reserves 2x ELEC-LT-01 and 1x ELEC-HD-03</text>
    <text x="790" y="335">• Creates Order &amp; Line Items</text>
    <text x="790" y="355">• Inserts OutboxEvent (Status: PENDING)</text>

    <text x="775" y="395" font-weight="bold" fill="#38bdf8">Step 2: Immediate Acceptance Response</text>
    <text x="790" y="415">• Returns HTTP 202 Accepted in &lt; 20ms</text>
    <text x="790" y="435">• Client does not block on Kafka broker roundtrips</text>

    <text x="775" y="475" font-weight="bold" fill="#f59e0b">Step 3: Reliable Outbox Relay</text>
    <text x="790" y="495">• Background worker polls pending outbox events</text>
    <text x="790" y="515">• Publishes event with tenant_id partition key</text>
    <text x="790" y="535">• Marks outbox event PUBLISHED</text>

    <text x="775" y="575" font-weight="bold" fill="#ec4899">Step 4: Idempotent Kafka Consumer</text>
    <text x="790" y="595">• Deduplicates against ProcessedEvents table</text>
    <text x="790" y="615">• Manually commits offset after fulfillment</text>
  </g>
</svg>
