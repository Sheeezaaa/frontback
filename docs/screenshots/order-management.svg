<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLightBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Light Blue Canvas Background -->
  <rect width="1200" height="680" fill="url(#bgLightBlue)"/>

  <!-- Top Title Header Card -->
  <rect x="40" y="30" width="1120" height="70" rx="10" fill="#ffffff" stroke="#bae6fd" filter="url(#shadow)"/>
  <text x="65" y="62" font-family="system-ui, sans-serif" font-weight="bold" font-size="20" fill="#0f172a">Multi-Tenant Order Management &amp; Asynchronous Pipeline</text>
  <text x="65" y="84" font-family="system-ui, sans-serif" font-size="12" fill="#0284c7">Transactional Outbox Pattern, HTTP 202 Accepted Durable Acceptance, and Stock Safety Checks</text>

  <!-- Left Column: Create Order Interface Form -->
  <rect x="40" y="115" width="560" height="535" rx="10" fill="#ffffff" stroke="#bae6fd" filter="url(#shadow)"/>
  <text x="65" y="148" font-family="system-ui, sans-serif" font-weight="bold" font-size="15" fill="#0f172a">Create New B2B Sales Order</text>
  <text x="65" y="168" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Tenant: ABC Electronics (tenant_id: abc-elec-4921)</text>

  <g font-family="system-ui, sans-serif" font-size="11">
    <!-- Customer Input -->
    <text x="65" y="200" font-weight="600" fill="#334155">CUSTOMER</text>
    <rect x="65" y="210" width="510" height="36" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="80" y="233" fill="#0f172a">Apex Micro Corp (apex@microcorp.io)</text>

    <!-- Product Line 1 -->
    <text x="65" y="270" font-weight="600" fill="#334155">ORDER ITEMS &amp; INVENTORY CHECK</text>
    <rect x="65" y="280" width="510" height="54" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="80" y="303" font-weight="bold" fill="#0f172a">Microcontroller Cortex-M4 (SKU: ELEC-MCU-01)</text>
    <text x="80" y="322" font-size="10" fill="#059669">Available Stock: 480 units | Price: $24.50</text>
    <text x="440" y="303" font-weight="bold" fill="#0284c7">Qty: 40</text>
    <text x="490" y="303" font-weight="bold" fill="#0f172a">$980.00</text>

    <!-- Product Line 2 -->
    <rect x="65" y="345" width="510" height="54" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="80" y="368" font-weight="bold" fill="#0f172a">Precision Resistor 10k 1% (SKU: ELEC-RES-01)</text>
    <text x="80" y="387" font-size="10" fill="#059669">Available Stock: 2,400 units | Price: $0.65</text>
    <text x="440" y="368" font-weight="bold" fill="#0284c7">Qty: 400</text>
    <text x="490" y="368" font-weight="bold" fill="#0f172a">$260.00</text>

    <!-- Total Row -->
    <rect x="65" y="415" width="510" height="42" rx="6" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="80" y="440" font-size="13" font-weight="bold" fill="#0369a1">TOTAL ORDER AMOUNT:</text>
    <text x="470" y="440" font-size="16" font-weight="bold" fill="#0284c7">$1,240.00</text>

    <!-- Submit Button Simulation -->
    <rect x="65" y="475" width="510" height="42" rx="6" fill="#0284c7"/>
    <text x="210" y="501" font-size="13" font-weight="bold" fill="#ffffff">✓ Submit Order (POST /api/v1/orders)</text>
    <text x="75" y="540" font-size="10" fill="#64748b">Returns HTTP 202 Accepted after atomic PostgreSQL and Outbox persistence</text>
  </g>

  <!-- Right Column: HTTP 202 Accepted & Kafka Outbox Pipeline Flow -->
  <rect x="620" y="115" width="540" height="535" rx="10" fill="#ffffff" stroke="#bae6fd" filter="url(#shadow)"/>
  <text x="645" y="148" font-family="system-ui, sans-serif" font-weight="bold" font-size="15" fill="#0f172a">Durable Acceptance &amp; Outbox Pipeline Flow</text>

  <!-- Step 1: HTTP 202 Card -->
  <rect x="645" y="170" width="490" height="95" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <rect x="660" y="185" width="130" height="22" rx="4" fill="#22c55e"/>
  <text x="670" y="200" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">HTTP 202 ACCEPTED</text>
  <text x="805" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#15803d">Durable Acceptance in 18.2ms</text>
  <g font-family="monospace" font-size="10" fill="#166534">
    <text x="660" y="225">Response: { success: true, orderId: "ord-abc-0104", status: "ACCEPTED" }</text>
    <text x="660" y="242">Guarantee: Persisted in PostgreSQL orders &amp; outbox_events tables</text>
    <text x="660" y="258">No Kafka publishing bottleneck in client request cycle</text>
  </g>

  <!-- Step 2: Outbox Table Entry -->
  <rect x="645" y="280" width="490" height="95" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <rect x="660" y="295" width="165" height="22" rx="4" fill="#3b82f6"/>
  <text x="670" y="310" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">TRANSACTIONAL OUTBOX</text>
  <text x="840" y="310" font-family="system-ui, sans-serif" font-size="11" fill="#1e40af">Reliable Event Relay</text>
  <g font-family="monospace" font-size="10" fill="#1e3a8a">
    <text x="660" y="335">outbox_id: "obx-89102" | event_type: "OrderCreated"</text>
    <text x="660" y="352">status: "PUBLISHED" | payload: { tenantId, orderId, totalAmount }</text>
    <text x="660" y="368">Relay poller dispatches to Kafka broker with zero event loss</text>
  </g>

  <!-- Step 3: Kafka Broker Ingestion -->
  <rect x="645" y="390" width="490" height="95" rx="8" fill="#faf5ff" stroke="#e9d5ff"/>
  <rect x="660" y="405" width="145" height="22" rx="4" fill="#a855f7"/>
  <text x="670" y="420" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">KAFKA CLOUD BROKER</text>
  <text x="820" y="420" font-family="system-ui, sans-serif" font-size="11" fill="#6b21a8">Partition Ordering Guarantee</text>
  <g font-family="monospace" font-size="10" fill="#581c87">
    <text x="660" y="445">topic: "tenant.orders" | message_key: "abc-elec-4921"</text>
    <text x="660" y="462">partition: 0 (Strict tenant sequencing) | offset: 142</text>
    <text x="660" y="478">Upstash / Apache Kafka cluster acknowledged in 0.8ms</text>
  </g>

  <!-- Step 4: Consumer Worker -->
  <rect x="645" y="500" width="490" height="95" rx="8" fill="#fdf4ff" stroke="#f0abfc"/>
  <rect x="660" y="515" width="160" height="22" rx="4" fill="#d946ef"/>
  <text x="670" y="530" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">CONSUMER RESOLUTION</text>
  <text x="840" y="530" font-family="system-ui, sans-serif" font-size="11" fill="#86198f">Idempotent Stock Deduction</text>
  <g font-family="monospace" font-size="10" fill="#701a75">
    <text x="660" y="555">1. Check processed_events (prevents duplicate execution)</text>
    <text x="660" y="572">2. Update tenant-scoped inventory (decrement 40 and 400)</text>
    <text x="660" y="588">3. Update orders status to "PROCESSED" &amp; manual commit offset 143</text>
  </g>
</svg>
