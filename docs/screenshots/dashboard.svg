  <text x="370" y="415" font-family="system-ui, sans-serif" font-size="11" fill="#0f172a">Acme Technologies Inc</text>
  <text x="510" y="415" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">$3,249.97</text>
  <rect x="600" y="402" width="75" height="18" rx="4" fill="#dcfce7"/>
  <text x="608" y="415" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#15803d">CONFIRMED</text>

  <!-- Row 2 -->
  <text x="270" y="450" font-family="monospace" font-size="11" font-weight="bold" fill="#0284c7">ORD-ABC-1002</text>
  <text x="370" y="450" font-family="system-ui, sans-serif" font-size="11" fill="#0f172a">Apex Solutions LLC</text>
  <text x="510" y="450" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">$729.98</text>
  <rect x="600" y="437" width="85" height="18" rx="4" fill="#e0f2fe"/>
  <text x="608" y="450" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#0369a1">PROCESSING</text>

  <!-- Row 3 -->
  <text x="270" y="485" font-family="monospace" font-size="11" font-weight="bold" fill="#0284c7">ORD-ABC-1003</text>
  <text x="370" y="485" font-family="system-ui, sans-serif" font-size="11" fill="#0f172a">CyberNet Enterprise</text>
  <text x="510" y="485" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">$1,499.99</text>
  <rect x="600" y="472" width="75" height="18" rx="4" fill="#fef3c7"/>
  <text x="612" y="485" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#b45309">PENDING</text>

  <!-- Kafka Live Stream Box -->
  <rect x="840" y="310" width="340" height="340" rx="10" fill="#0f172a" filter="url(#shadow)"/>
  <text x="860" y="338" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Kafka Event Stream</text>
  <text x="860" y="352" font-family="monospace" font-size="10" fill="#38bdf8">saas-order-consumer-group</text>

  <rect x="856" y="370" width="308" height="65" rx="6" fill="#1e293b"/>
  <text x="868" y="390" font-family="monospace" font-size="10" font-weight="bold" fill="#38bdf8">OFFSET: #1048 | Partition 0</text>
  <text x="868" y="405" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff">Event: OrderCreated (Key: tenant_abc)</text>
  <text x="868" y="420" font-family="system-ui, sans-serif" font-size="9" fill="#10b981">✓ Idempotently Committed (Manual Commit)</text>

  <rect x="856" y="445" width="308" height="65" rx="6" fill="#1e293b"/>
  <text x="868" y="465" font-family="monospace" font-size="10" font-weight="bold" fill="#38bdf8">OFFSET: #1047 | Partition 0</text>
  <text x="868" y="480" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff">Event: OrderCreated (Key: tenant_abc)</text>
  <text x="868" y="495" font-family="system-ui, sans-serif" font-size="9" fill="#10b981">✓ Stock Finalized &amp; Serverless Invoiced</text>

  <rect x="856" y="520" width="308" height="65" rx="6" fill="#1e293b"/>
  <text x="868" y="540" font-family="monospace" font-size="10" font-weight="bold" fill="#38bdf8">OFFSET: #1046 | Partition 0</text>
  <text x="868" y="555" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff">DLQ Recovery: 0 items failed</text>
  <text x="868" y="570" font-family="system-ui, sans-serif" font-size="9" fill="#10b981">✓ Strict tenant_id Verification Passed</text>
</svg>
