  <text x="32" y="44" font-family="system-ui, sans-serif" font-weight="bold" font-size="20" fill="#ffffff">O</text>
  <text x="68" y="38" font-family="system-ui, sans-serif" font-weight="bold" font-size="16" fill="#ffffff">OmniOrder</text>
  <text x="68" y="52" font-family="system-ui, sans-serif" font-weight="600" font-size="9" fill="#38bdf8" letter-spacing="1">B2B SAAS PLATFORM</text>

  <!-- Sidebar Nav items -->
  <g font-family="system-ui, sans-serif" font-size="12" font-weight="500">
    <rect x="12" y="80" width="196" height="34" rx="6" fill="#0284c7"/>
    <text x="45" y="102" fill="#ffffff" font-weight="600">📊 Dashboard</text>

    <text x="45" y="140" fill="#94a3b8">🛒 Orders</text>
    <text x="45" y="176" fill="#94a3b8">➕ Create Order</text>
    <text x="45" y="212" fill="#94a3b8">📦 Products Catalog</text>
    <text x="45" y="248" fill="#94a3b8">🏢 Inventory Stock</text>
    <text x="45" y="284" fill="#94a3b8">👥 Customers</text>
    <text x="45" y="320" fill="#94a3b8">⚡ Event Monitoring</text>
    <text x="45" y="356" fill="#38bdf8" font-weight="600">🔥 DB Benchmarking</text>
    <text x="45" y="392" fill="#94a3b8">⚙️ Company Settings</text>
  </g>

  <!-- Tenant Badge in Sidebar Footer -->
  <rect x="12" y="620" width="196" height="46" rx="8" fill="#1e293b"/>
  <circle cx="34" cy="643" r="14" fill="#0284c7"/>
  <text x="29" y="648" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#ffffff">A</text>
  <text x="56" y="638" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#ffffff">ABC Electronics</text>
  <text x="56" y="653" font-family="system-ui, sans-serif" font-size="10" fill="#38bdf8">tenant_id: abc-elec-4921</text>

  <!-- Topbar -->
  <rect x="220" y="0" width="980" height="60" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
  <rect x="240" y="14" width="230" height="32" rx="6" fill="#f0f9ff" stroke="#bae6fd"/>
  <text x="252" y="34" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0369a1">Active Tenant: ABC Electronics</text>
  <rect x="430" y="20" width="30" height="20" rx="4" fill="#bae6fd"/>
  <text x="436" y="34" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#0369a1">LIVE</text>

  <rect x="1000" y="14" width="180" height="32" rx="6" fill="#f0f9ff" stroke="#bae6fd"/>
