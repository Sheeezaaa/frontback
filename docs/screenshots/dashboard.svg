  <!-- Card 1 -->
  <rect x="240" y="80" width="225" height="100" rx="10" fill="#ffffff" stroke="#bae6fd" filter="url(#shadow)"/>
  <text x="260" y="110" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0284c7" letter-spacing="0.5">TOTAL ORDERS</text>
  <text x="260" y="145" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#0f172a">1,428</text>
  <rect x="390" y="98" width="55" height="20" rx="4" fill="#dcfce7"/>
  <text x="398" y="112" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#15803d">+12.4%</text>

  <!-- Card 2 -->
  <rect x="485" y="80" width="225" height="100" rx="10" fill="#ffffff" stroke="#bae6fd" filter="url(#shadow)"/>
  <text x="505" y="110" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0284c7" letter-spacing="0.5">GROSS REVENUE</text>
  <text x="505" y="145" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#0f172a">$184,290</text>
  <rect x="635" y="98" width="55" height="20" rx="4" fill="#dcfce7"/>
  <text x="643" y="112" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#15803d">+18.2%</text>

  <!-- Card 3 -->
  <rect x="730" y="80" width="225" height="100" rx="10" fill="#ffffff" stroke="#bae6fd" filter="url(#shadow)"/>
  <text x="750" y="110" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0284c7" letter-spacing="0.5">KAFKA PIPELINE</text>
  <text x="750" y="145" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#0f172a">99.98%</text>
  <rect x="880" y="98" width="55" height="20" rx="4" fill="#e0f2fe"/>
  <text x="888" y="112" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#0369a1">0.8ms</text>

