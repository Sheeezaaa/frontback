    <text x="700" y="315" fill="#0284c7" font-weight="600">✓ Part: 0 / Off: 142</text>

    <line x1="255" y1="335" x2="825" y2="335" stroke="#e0f2fe"/>

    <text x="270" y="365" font-weight="600">ORD-ABC-0103</text>
