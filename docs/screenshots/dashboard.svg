  <text x="976" y="224" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">AVAILABLE INVENTORY</text>
  <text x="976" y="256" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#0f172a">3,890 Units</text>
