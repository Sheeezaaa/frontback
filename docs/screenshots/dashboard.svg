  <text x="736" y="256" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#f59e0b">8 Orders</text>
  <text x="736" y="276" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#f59e0b">Consumer lag: 0 ms</text>

