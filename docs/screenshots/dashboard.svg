    <text x="700" y="365" fill="#0284c7" font-weight="600">✓ Part: 1 / Off: 98</text>

    <line x1="255" y1="385" x2="825" y2="385" stroke="#e0f2fe"/>

    <text x="270" y="415" font-weight="600">ORD-ABC-0102</text>
    <text x="360" y="415">Silicon Wave Inc</text>
    <text x="490" y="415" font-weight="bold">$3,420.00</text>
    <rect x="580" y="402" width="65" height="18" rx="4" fill="#fef9c3"/>
    <text x="590" y="415" font-size="10" font-weight="bold" fill="#854d0e">ACCEPTED</text>
    <text x="700" y="415" fill="#0284c7" font-weight="600">✓ Part: 0 / Off: 143</text>

    <line x1="255" y1="435" x2="825" y2="435" stroke="#e0f2fe"/>

    <text x="270" y="465" font-weight="600">ORD-ABC-0101</text>
    <text x="360" y="465">Quantum Chip Ltd</text>
    <text x="490" y="465" font-weight="bold">$450.00</text>
    <rect x="580" y="452" width="65" height="18" rx="4" fill="#dcfce7"/>
    <text x="590" y="465" font-size="10" font-weight="bold" fill="#15803d">PROCESSED</text>
    <text x="700" y="465" fill="#0284c7" font-weight="600">✓ Part: 2 / Off: 81</text>
  </g>

  <!-- Right Panel: Live Kafka Consumer Stream & Outbox Relay -->
  <rect x="860" y="200" width="320" height="460" rx="10" fill="#ffffff" stroke="#bae6fd" filter="url(#shadow)"/>
  <rect x="860" y="200" width="320" height="42" rx="10" fill="#f0f9ff"/>
  <text x="880" y="226" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0369a1">⚡ Live Kafka Consumer Stream</text>

  <g font-family="monospace" font-size="10">
    <rect x="875" y="255" width="290" height="60" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="885" y="275" fill="#15803d" font-weight="bold">[CONSUMED] OrderCreated</text>
    <text x="885" y="290" fill="#64748b">topic: tenant.orders | part: 0</text>
    <text x="885" y="305" fill="#0284c7">offset: 143 | key: abc-elec-4921</text>

    <rect x="875" y="325" width="290" height="60" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="885" y="345" fill="#0284c7" font-weight="bold">[OUTBOX RELAY] Published</text>
    <text x="885" y="360" fill="#64748b">order_id: ord-92a104</text>
    <text x="885" y="375" fill="#15803d">status: PUBLISHED | latency: 1.2ms</text>

    <rect x="875" y="395" width="290" height="60" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="885" y="415" fill="#0369a1" font-weight="bold">[INVENTORY] Reserved Stock</text>
    <text x="885" y="430" fill="#64748b">sku: ELEC-RES-01 | qty: -4</text>
    <text x="885" y="445" fill="#15803d">idempotency: PROCESSED_OK</text>

    <rect x="875" y="465" width="290" height="60" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="885" y="485" fill="#854d0e" font-weight="bold">[MANUAL COMMIT] Offset Committed</text>
    <text x="885" y="500" fill="#64748b">consumer_group: omniorder-group</text>
    <text x="885" y="515" fill="#0284c7">commitOffset: 143 confirmed</text>
  </g>

  <!-- Live Health Bar at bottom -->
  <rect x="875" y="550" width="290" height="90" rx="8" fill="#ecfeff" stroke="#a5f3fc"/>
  <text x="890" y="575" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0e7490">Tenant Isolation Verified</text>
  <text x="890" y="595" font-family="system-ui, sans-serif" font-size="10" fill="#155e75">Tenant B (XYZ Fashion) data strictly partitioned.</text>
  <text x="890" y="612" font-family="system-ui, sans-serif" font-size="10" fill="#155e75">Zero cross-tenant data leakage observed.</text>
</svg>
