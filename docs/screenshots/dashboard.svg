  <text x="496" y="256" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#0f172a">1,420</text>
  <text x="496" y="276" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#0284c7">98.4% fulfilled on time</text>

  <!-- Card 3 -->
