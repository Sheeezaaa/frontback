  <text x="270" y="382" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#64748b">ORDER #</text>
  <text x="370" y="382" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#64748b">CUSTOMER</text>
  <text x="510" y="382" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#64748b">TOTAL</text>
  <text x="600" y="382" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#64748b">STATUS</text>

