  <text x="1016" y="34" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">A</text>
  <text x="1038" y="34" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a">alex@abc.com</text>

