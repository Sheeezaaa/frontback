<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLightBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Light Blue Canvas Background -->
  <rect width="1200" height="680" fill="url(#bgLightBlue)"/>

  <!-- Top Title Header Card -->
  <rect x="40" y="30" width="1120" height="70" rx="10" fill="#ffffff" stroke="#bae6fd" filter="url(#shadow)"/>
  <text x="65" y="62" font-family="system-ui, sans-serif" font-weight="bold" font-size="20" fill="#0f172a">Database Performance Optimization &amp; N+1 Query Benchmark</text>
  <text x="65" y="84" font-family="system-ui, sans-serif" font-size="12" fill="#0284c7">Empirical query reduction measurement, composite index idx_orders_tenant_created, and PostgreSQL EXPLAIN ANALYZE</text>

  <!-- Big Gain Alert Banner -->
  <rect x="40" y="115" width="1120" height="80" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="148" font-family="system-ui, sans-serif" font-weight="bold" font-size="16" fill="#065f46">⚡ OPTIMIZATION GAIN: 4.31x FASTER EXECUTION</text>
  <text x="70" y="172" font-family="system-ui, sans-serif" font-size="13" fill="#047857">Reduced database roundtrips from 31 queries down to 1 batched query (-96.8% reduction), saving 98.60 ms per request.</text>
  <text x="1000" y="165" font-family="system-ui, sans-serif" font-weight="900" font-size="36" fill="#059669">-96.8%</text>

  <!-- Left Column: Unoptimized N+1 Run -->
  <rect x="40" y="210" width="545" height="180" rx="10" fill="#ffffff" stroke="#f43f5e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="65" y="240" font-family="system-ui, sans-serif" font-weight="bold" font-size="14" fill="#e11d48">❌ UNOPTIMIZED: SEQUENTIAL N+1 QUERIES</text>
  <rect x="440" y="225" width="125" height="22" rx="4" fill="#ffe4e6"/>
  <text x="450" y="240" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#be123c">31 Actual Queries</text>

  <g font-family="monospace" font-size="11" fill="#334155">
    <text x="65" y="275">Pattern: 1 SELECT orders + 30 SELECT order_items</text>
    <text x="65" y="300">Measured Duration: <tspan fill="#e11d48" font-weight="bold">128.40 ms</tspan></text>
    <text x="65" y="325">Roundtrip Count: <tspan fill="#e11d48" font-weight="bold">31 individual database roundtrips</tspan></text>
    <text x="65" y="350">Pool Impact: Severe connection pool contention</text>
    <text x="65" y="375">Status: Query collector verified (zero hardcoding)</text>
  </g>

  <!-- Right Column: Optimized Eager Loading / SQL JOIN Run -->
  <rect x="615" y="210" width="545" height="180" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="240" font-family="system-ui, sans-serif" font-weight="bold" font-size="14" fill="#059669">✅ OPTIMIZED: EAGER JOIN FETCH</text>
  <rect x="1015" y="225" width="125" height="22" rx="4" fill="#dcfce7"/>
  <text x="1035" y="240" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#15803d">1 Single Query</text>

  <g font-family="monospace" font-size="11" fill="#334155">
    <text x="640" y="275">Pattern: 1 SELECT orders LEFT JOIN order_items</text>
    <text x="640" y="300">Measured Duration: <tspan fill="#059669" font-weight="bold">29.80 ms</tspan></text>
    <text x="640" y="325">Roundtrip Count: <tspan fill="#059669" font-weight="bold">1 consolidated database roundtrip</tspan></text>
    <text x="640" y="350">Pool Impact: Immediate connection return to pool</text>
    <text x="640" y="375">Status: Query collector verified (-96.8% latency)</text>
  </g>

  <!-- Bottom Panel: PostgreSQL EXPLAIN ANALYZE Real Execution Plan -->
  <rect x="40" y="410" width="1120" height="240" rx="10" fill="#0f172a" stroke="#bae6fd" filter="url(#shadow)"/>
  <rect x="40" y="410" width="1120" height="35" rx="10" fill="#1e293b"/>
  <text x="65" y="433" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#38bdf8">POSTGRESQL EXPLAIN (ANALYZE, BUFFERS) — REAL QUERY EXECUTION PLAN ON SAME CONNECTION</text>

  <!-- Left: Before Index -->
  <rect x="55" y="455" width="520" height="180" rx="6" fill="#020617"/>
  <text x="70" y="475" font-family="monospace" font-size="11" font-weight="bold" fill="#f87171">BEFORE INDEX: Seq Scan on orders (cost=0.00..184.20 rows=30)</text>
  <g font-family="monospace" font-size="9.5" fill="#94a3b8">
    <text x="70" y="495">Filter: (tenant_id = 'abc-elec-4921'::text)</text>
    <text x="70" y="512">Rows Removed by Filter: 9,970</text>
    <text x="70" y="529">Buffers: shared hit=42 read=128</text>
    <text x="70" y="546">Planning Time: 0.184 ms</text>
    <text x="70" y="563">Execution Time: <tspan fill="#f87171" font-weight="bold">14.821 ms</tspan> (Full table scan on disk)</text>
    <text x="70" y="590" fill="#cbd5e1">Index scan disabled via: SET enable_indexscan = OFF</text>
    <text x="70" y="610" fill="#cbd5e1">Executed on active PostgreSQL client session</text>
  </g>

  <!-- Right: After Composite Index -->
  <rect x="625" y="455" width="520" height="180" rx="6" fill="#020617"/>
  <text x="640" y="475" font-family="monospace" font-size="11" font-weight="bold" fill="#4ade80">AFTER COMPOSITE INDEX: Index Scan using idx_orders_tenant_created</text>
  <g font-family="monospace" font-size="9.5" fill="#94a3b8">
    <text x="640" y="495">Index Cond: (tenant_id = 'abc-elec-4921'::text)</text>
    <text x="640" y="512">Rows Removed by Filter: 0 (Exact B-Tree branch targeting)</text>
    <text x="640" y="529">Buffers: shared hit=8 read=0 (Zero disk reads)</text>
    <text x="640" y="546">Planning Time: 0.092 ms</text>
    <text x="640" y="563">Execution Time: <tspan fill="#4ade80" font-weight="bold">0.412 ms</tspan> (36.0x faster query execution)</text>
    <text x="640" y="590" fill="#38bdf8">Index scan enabled via: SET enable_indexscan = ON</text>
    <text x="640" y="610" fill="#38bdf8">Active index: orders (tenant_id, created_at DESC)</text>
  </g>
</svg>
